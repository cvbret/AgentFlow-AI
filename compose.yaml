services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: agentflow_dev_only
      POSTGRES_DB: agentflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentflow -d agentflow"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Deliberately independent of the root .env's host-only DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://agentflow:agentflow_dev_only@postgres:5432/agentflow
      LLM_API_KEY: ${LLM_API_KEY:-local-placeholder}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://example.com/v1}
      LLM_MODEL: ${LLM_MODEL:-test-model}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-1}
      RECOVERY_STALE_AFTER_SECONDS: ${RECOVERY_STALE_AFTER_SECONDS:-300}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
volumes:
  postgres_data:
