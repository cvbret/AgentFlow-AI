name: Backend qualification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentflow
          POSTGRES_PASSWORD: ci_placeholder
          POSTGRES_DB: agentflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U agentflow -d agentflow_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://agentflow:ci_placeholder@localhost:5432/agentflow_test
      LLM_API_KEY: ci-placeholder
      LLM_BASE_URL: https://example.com/v1
      LLM_MODEL: test-model
      LLM_TIMEOUT_SECONDS: '30'
      LLM_MAX_ATTEMPTS: '3'
      LLM_RETRY_BASE_DELAY_SECONDS: '1'
      RECOVERY_STALE_AFTER_SECONDS: '300'
      LANGSMITH_TRACING: 'false'
      TEMP: ${{ github.workspace }}/.venv/tmp
      TMP: ${{ github.workspace }}/.venv/tmp
      TMPDIR: ${{ github.workspace }}/.venv/tmp
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare repository-owned temporary directory
        run: mkdir -p "$TEMP"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir -r backend/requirements.txt
          python -m pip check
      - name: Initialize both schema owners
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.workflows.setup
          python -m alembic check
      - name: Full PostgreSQL qualification (zero skips and warnings)
        working-directory: backend
        run: python -m scripts.qualified_tests -q
      - name: Build application image
        run: docker build --no-cache -t agentflow-ci .
